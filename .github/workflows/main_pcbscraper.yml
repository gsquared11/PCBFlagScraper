name: Build and deploy Python project to Azure Function App - pcbscraper

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'pcbscraper'
  PYTHON_VERSION: '3.11'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for the OIDC login below
      contents: read  # required for actions/checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_879F037E8A484420A8F049D4049238B4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_40964E32FB3743849B905147AB7162A2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0401993D9BE44F419A7AFDA1C6A7379B }}

      # Flex Consumption + Python: Azure must build the package remotely from
      # requirements.txt. Do NOT vendor .python_packages, and do NOT set
      # scm-do-build-during-deployment or enable-oryx-build — Oryx always runs
      # during a Flex remote build, and setting them breaks function indexing.
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: '.'
          remote-build: true
